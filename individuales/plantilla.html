<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>{{TITULO}}</title>
<style>
{{FUENTES}}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --tinta: {{TINTA}};
  --acento: {{ACENTO}};
  --suave: {{SUAVE}};
  --panel: {{PANEL}};
  --hueso: #F7F2E8;
}

@page { size: 426mm 303mm; margin: 0; }

html, body { background: #101010; }

/* Lienzo con sangrado: corte final 420 x 297 mm (A3 apaisado) + 3 mm por lado */
.sangrado {
  position: relative;
  width: 426mm;
  height: 303mm;
  overflow: hidden;
  background: {{FONDO}};
  background-size: cover;
  background-position: center;
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  color: var(--hueso);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.velo { position: absolute; inset: 0; background: {{VELO}}; }

/* Zona segura: 3 mm de sangrado + 13 mm de margen de seguridad */
.lienzo {
  position: absolute;
  inset: 16mm;
  display: flex;
  gap: 16mm;
}

/* ------------------------------ columna izquierda ------------------------------ */
.izquierda {
  width: 150mm;
  flex: none;
  display: flex;
  flex-direction: column;
}

.logo { height: 30mm; width: auto; object-fit: contain; object-position: left center; }

.marca-texto { line-height: .95; }
.marca-texto .nombre {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 700;
  font-size: 17mm;
  letter-spacing: .14em;
}
.marca-texto .lema {
  margin-top: 3mm;
  font-size: 3.6mm;
  font-weight: 300;
  letter-spacing: .42em;
  text-transform: uppercase;
  color: var(--suave);
}

.lugar {
  margin-top: 11mm;
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600;
  font-size: 10mm;
  color: var(--acento);
}

.filete {
  margin: 7mm 0;
  width: 34mm;
  height: .8mm;
  background: var(--acento);
  border-radius: 1mm;
}

.bienvenida {
  font-size: 5mm;
  font-weight: 300;
  line-height: 1.6;
  max-width: 128mm;
  color: rgba(247, 242, 232, .92);
}

.contacto {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 3.4mm;
  font-size: 4.2mm;
  font-weight: 400;
}
.contacto .fila { display: flex; align-items: center; gap: 4mm; }
.contacto svg { width: 5.2mm; height: 5.2mm; flex: none; color: var(--acento); }

/* ------------------------------ columna derecha ------------------------------ */
.derecha {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 11mm;
}

.bloques {
  flex: none;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-rows: min-content;
  gap: 9mm;
}

.bloque {
  background: var(--panel);
  border: .4mm solid rgba(255, 255, 255, .16);
  border-radius: 5mm;
  padding: 8mm 8mm 7.5mm;
  display: flex;
  flex-direction: column;
}

.bloque .cabecera { display: flex; align-items: center; gap: 4mm; }
.bloque svg { width: 7mm; height: 7mm; flex: none; color: var(--acento); }
.bloque h2 {
  font-size: 4.2mm;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--acento);
}
.bloque ul { margin-top: 5.5mm; list-style: none; display: flex; flex-direction: column; gap: 2.8mm; }
.bloque li { font-size: 4.5mm; font-weight: 300; line-height: 1.4; }
.bloque li b { font-weight: 500; color: #fff; }

/* ------------------------------ tira del QR ------------------------------ */
.tira-qr {
  display: flex;
  align-items: center;
  gap: 9mm;
  background: var(--panel);
  border: .4mm solid rgba(255, 255, 255, .16);
  border-radius: 5mm;
  padding: 7mm 9mm;
}

.qr {
  width: 34mm;
  height: 34mm;
  flex: none;
  background: #fff;
  border-radius: 3mm;
  padding: 2.4mm;
}
.qr svg { width: 100%; height: 100%; display: block; }

.tira-qr .texto { display: flex; flex-direction: column; gap: 2.2mm; }
.tira-qr .invita {
  font-size: 3.6mm;
  font-weight: 600;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--suave);
}
.tira-qr .cuenta {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600;
  font-size: 8mm;
  color: var(--acento);
}
.tira-qr .nota { font-size: 3.8mm; font-weight: 300; color: rgba(247, 242, 232, .82); }

/* Marca de agua sólo para borradores; desaparece al completar los datos. */
.aviso {
  position: absolute;
  left: 16mm;
  bottom: 5mm;
  font-size: 3.2mm;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, .55);
}
</style>
</head>
<body>
<div class="sangrado">
  <div class="velo"></div>

  <div class="lienzo">
    <aside class="izquierda">
      {{LOGO}}

      <div class="lugar">{{LUGAR}}</div>
      <div class="filete"></div>
      <p class="bienvenida">{{BIENVENIDA}}</p>

      <div class="contacto">{{CONTACTO}}</div>
    </aside>

    <section class="derecha">
      <div class="bloques">{{BLOQUES}}</div>

      <div class="tira-qr">
        <div class="qr">{{QR}}</div>
        <div class="texto">
          <span class="invita">Síguenos en Instagram</span>
          <span class="cuenta">@{{INSTAGRAM}}</span>
          <span class="nota">Escanea el código y mira el lugar por dentro.</span>
        </div>
      </div>
    </section>
  </div>

  {{AVISO}}
</div>
</body>
</html>
