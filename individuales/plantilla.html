<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>{{TITULO}}</title>
<style>
{{FUENTES}}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --acento: {{ACENTO}};
  --acento-texto: {{ACENTO_TEXTO}};
  --hueso: #FFFFFF;

  /* Forma del individual: arco de medio punto arriba, base recta abajo. */
  --curva-h: 50%;      /* radio horizontal del arco = media pieza */
  --curva-v: {{CURVA}}; /* altura del arco */
  --esquina: 16mm;     /* redondeo de las esquinas de abajo */

  --sombra-texto: 0 .4mm 1.6mm rgba(0, 0, 0, .55);
}

@page { size: {{PAGINA_ANCHO}} {{PAGINA_ALTO}}; margin: 0; }

html, body { background: #12100E; }
body.modo-vista, body.modo-vista .pagina { background: transparent; }

/* Hoja con sangrado. El corte final es la forma de arco (.pieza). */
.pagina {
  position: relative;
  width: {{PAGINA_ANCHO}};
  height: {{PAGINA_ALTO}};
  overflow: hidden;
  background: {{FONDO}};
  background-size: {{PAGINA_ANCHO}} {{PAGINA_ALTO}};
  background-position: center;
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  color: var(--hueso);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

/* La pieza: lo que queda después del troquel. */
.pieza {
  position: absolute;
  inset: {{SANGRADO}};
  overflow: hidden;
  border-radius:
    var(--curva-h) var(--curva-h) var(--esquina) var(--esquina) /
    var(--curva-v) var(--curva-v) var(--esquina) var(--esquina);
}

/* Copia de la foto alineada con la hoja, para que la vista recortada se vea igual. */
.foto {
  position: absolute;
  inset: calc(-1 * {{SANGRADO}});
  background: {{FONDO}};
  background-size: {{PAGINA_ANCHO}} {{PAGINA_ALTO}};
  background-position: center;
}

.velo { position: absolute; inset: 0; background: {{VELO}}; }

/* Filete blanco que sigue el contorno. */
.filete {
  position: absolute;
  inset: 5mm;
  border: .9mm solid rgba(255, 255, 255, .88);
  border-radius:
    var(--curva-h) var(--curva-h) 11mm 11mm /
    calc(var(--curva-v) - 1.2%) calc(var(--curva-v) - 1.2%) 11mm 11mm;
}

.contenido { position: absolute; inset: 0; }

/* ---------------------------------- marca ---------------------------------- */
.marca { padding-top: {{MARCA_ARRIBA}}; text-align: center; }
.marca img { height: {{LOGO_ALTO}}; width: auto; object-fit: contain; filter: drop-shadow(0 .6mm 2mm rgba(0,0,0,.35)); }

.marca-texto { line-height: 1; text-shadow: var(--sombra-texto); }
.marca-texto .nombre {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 700;
  font-size: 18mm;
  letter-spacing: .16em;
}
.marca-texto .lema {
  margin-top: 4mm;
  font-size: 4mm;
  font-weight: 500;
  letter-spacing: .44em;
  text-transform: uppercase;
}

.sector {
  margin-top: 6mm;
  font-size: 5.4mm;
  font-weight: 600;
  letter-spacing: .36em;
  text-transform: uppercase;
  text-shadow: var(--sombra-texto);
}

/* --------------------------------- columnas -------------------------------- */
.columnas {
  margin-top: {{COLUMNAS_ARRIBA}};
  padding: 0 {{COLUMNAS_LADO}};
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.columna { width: {{COLUMNA_ANCHO}}; display: flex; flex-direction: column; gap: 11mm; }
.columna.der { text-align: right; align-items: flex-end; }

.pastilla {
  display: inline-block;
  background: var(--acento);
  color: var(--acento-texto);
  border-radius: 999px;
  padding: 2.6mm 8mm 2.2mm;
  font-size: 4.4mm;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  box-shadow: 0 .8mm 2.4mm rgba(0, 0, 0, .22);
}

.columna ul { margin-top: 6mm; list-style: none; display: flex; flex-direction: column; gap: 5mm; }
.columna li {
  font-size: 5.4mm;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: .01em;
  text-transform: uppercase;
  text-shadow: var(--sombra-texto);
}
.grupo.recto li { font-style: normal; letter-spacing: .03em; }

.columna li small {
  display: block;
  margin-top: 1.2mm;
  font-size: 4mm;
  font-style: normal;
  font-weight: 400;
  letter-spacing: .04em;
  text-transform: none;
}

/* ----------------------------------- pie ----------------------------------- */
.web {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 13mm;
  text-align: center;
  font-size: 4.6mm;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  text-shadow: var(--sombra-texto);
}

.qr-caja {
  position: absolute;
  right: {{PIE_LADO}};
  bottom: {{PIE_ABAJO}};
  width: 46mm;
  background: #fff;
  border-radius: 4mm;
  padding: 4mm 4mm 4.5mm;
  text-align: center;
  box-shadow: 0 1mm 3mm rgba(0, 0, 0, .22);
}
.qr-caja .titulo {
  display: block;
  font-size: 3.4mm;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #3B3B3B;
}
.qr-caja .cuenta {
  display: block;
  margin-bottom: 3mm;
  font-size: 4.4mm;
  font-weight: 700;
  color: var(--acento);
}
.qr-caja .qr { width: 100%; aspect-ratio: 1; }
.qr-caja .qr svg { width: 100%; height: 100%; display: block; }

/* Marca de borrador: desaparece sola al completar los datos. */
.aviso {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 7mm;
  text-align: center;
  font-size: 3.2mm;
  font-weight: 500;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, .75);
  text-shadow: var(--sombra-texto);
}

/* Línea de troquel: sólo para la imprenta, se oculta en la vista. */
.troquel {
  position: absolute;
  inset: {{SANGRADO}};
  border: .3mm dashed rgba(255, 0, 180, .9);
  border-radius:
    var(--curva-h) var(--curva-h) var(--esquina) var(--esquina) /
    var(--curva-v) var(--curva-v) var(--esquina) var(--esquina);
  pointer-events: none;
}
body.modo-vista .troquel, body.sin-troquel .troquel { display: none; }
</style>
</head>
<body>
<div class="pagina">
  <div class="pieza">
    <div class="foto"></div>
    <div class="velo"></div>
    <div class="filete"></div>

    <div class="contenido">
      <header class="marca">
        {{LOGO}}
        <div class="sector">{{SECTOR}}</div>
      </header>

      <div class="columnas">
        <div class="columna izq">{{COLUMNA_IZQ}}</div>
        <div class="columna der">{{COLUMNA_DER}}</div>
      </div>

      <div class="qr-caja">
        <span class="titulo">Síguenos en</span>
        <span class="cuenta">@{{INSTAGRAM}}</span>
        <div class="qr">{{QR}}</div>
      </div>

      <div class="web">{{WEB}}</div>

      {{AVISO}}
    </div>
  </div>

  <div class="troquel"></div>
</div>

<script>
  // ?vista  → se ve la pieza ya troquelada, sin sangrado ni línea de corte.
  // ?sin-troquel → hoja completa con sangrado, sin la línea rosada.
  const q = location.search;
  if (q.includes('vista')) document.body.classList.add('modo-vista');
  if (q.includes('sin-troquel')) document.body.classList.add('sin-troquel');
</script>
</body>
</html>
