name: Publicar sitio Milch

on:
  push:
    branches: [claude/influence-chile-promo-graphic-zix4zb]
    paths:
      - index.html
      - admin.html
      - CNAME
      - img/**
      - .github/workflows/publicar-sitio.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar archivos del sitio
        run: |
          mkdir _site
          cp index.html admin.html _site/
          cp -r img _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Configurar dominio www.mresin.cl
        continue-on-error: true
        run: |
          curl -sS -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"cname":"www.mresin.cl"}'
