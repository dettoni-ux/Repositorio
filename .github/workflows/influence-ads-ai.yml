name: Influence Ads AI — pruebas

on:
  push:
    paths: ["influence-ads-ai/**", ".github/workflows/influence-ads-ai.yml"]
  pull_request:
    paths: ["influence-ads-ai/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: influence-ads-ai
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ia
          POSTGRES_PASSWORD: ia_local
          POSTGRES_DB: influence_ads_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ia:ia_local@localhost:5432/influence_ads_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: influence-ads-ai/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
