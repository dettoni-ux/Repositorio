<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Nunito:wght@400;700;800&display=swap">
<link rel="stylesheet" href="base.css">
<style>
  body{background:linear-gradient(160deg,#2C1140 0%,#3C1D55 55%,#5B2E7E 100%);position:relative}
  .deco{position:absolute;opacity:.10;pointer-events:none}
  .contenido{
    position:relative;height:100%;display:flex;flex-direction:column;
    align-items:center;text-align:center;padding:64px 80px 56px;
  }
  .etiqueta{background:rgba(255,255,255,.14);color:var(--amarillo-2)}
  .destacado{
    margin-top:40px;font-weight:800;font-size:190px;line-height:1.12;
    background:var(--grad-amarillo);-webkit-background-clip:text;background-clip:text;color:transparent;
    max-width:100%;overflow:hidden;white-space:nowrap;
  }
  .titulo{
    margin-top:24px;color:#fff;font-weight:800;font-size:58px;line-height:1.2;
    max-height:212px;overflow:hidden;text-wrap:balance;
  }
  .lineas{margin-top:40px;display:flex;flex-wrap:wrap;gap:20px;justify-content:center;max-height:300px;overflow:hidden}
  .linea{
    background:rgba(234,220,244,.14);border:2px solid rgba(234,220,244,.35);
    border-radius:999px;padding:20px 38px;color:var(--lila);
    font-size:31px;font-weight:700;max-width:900px;
  }
  .cierre-zona{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:30px}
  .cierre{color:var(--lila);font-size:34px;font-weight:700;max-height:88px;overflow:hidden}
  .cta{background:var(--grad-amarillo);color:var(--morado-noche);font-size:33px;font-weight:800;font-family:'Poppins',sans-serif;padding:22px 52px}
</style>
</head>
<body>
  <svg class="deco" style="top:120px;left:70px;width:130px" viewBox="0 0 100 100"><g fill="#FFD84D"><ellipse cx="50" cy="62" rx="26" ry="20"/><circle cx="24" cy="36" r="11"/><circle cx="50" cy="28" r="11"/><circle cx="76" cy="36" r="11"/></g></svg>
  <svg class="deco" style="bottom:180px;right:60px;width:170px;transform:rotate(24deg)" viewBox="0 0 100 100"><g fill="#EADCF4"><ellipse cx="50" cy="62" rx="26" ry="20"/><circle cx="24" cy="36" r="11"/><circle cx="50" cy="28" r="11"/><circle cx="76" cy="36" r="11"/></g></svg>
  <div class="contenido">
    <!--LOGO-->
    <span class="pill etiqueta" style="margin-top:44px">{{etiqueta}}</span>
    <div class="destacado" data-ajuste="destacado">{{destacado}}</div>
    <h1 class="titulo" data-ajuste="titulo">{{titulo}}</h1>
    <div class="lineas" data-ajuste="lineas"><!--LINEAS--></div>
    <div class="cierre-zona">
      <span class="cierre" data-ajuste="cierre">{{cierre}}</span>
      <span class="pill cta">Regístrate gratis · encuentravet.cl</span>
    </div>
  </div>
</body>
</html>
